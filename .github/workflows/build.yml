name: Build

on:
  push:
    branches: [main]
  pull_request:

# Build and test only: the token needs nothing beyond reading the repository.
permissions:
  contents: read

jobs:
  host-tests:
    name: Host unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run core unit tests
        run: make -C test/host
      - name: Run JSON parser tests (ArduinoJson)
        run: |
          git clone --depth 1 --branch v7.4.3 https://github.com/bblanchon/ArduinoJson.git "$RUNNER_TEMP/ArduinoJson"
          make -C test/host json ARDUINOJSON="$RUNNER_TEMP/ArduinoJson/src"

  firmware:
    name: ESP32 firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio/libdeps
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Build
        run: pio run -e ESP32_DMD
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: .pio/build/ESP32_DMD/firmware.bin
