name: Build

on:
  push:
    branches: [main]
  pull_request:

# Build and test only: the token needs nothing beyond reading the repository.
permissions:
  contents: read

jobs:
  host-tests:
    name: Host tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: test/host/deps
          key: host-deps-${{ hashFiles('test/host/Makefile') }}
      - name: Install gcovr
        run: pip install gcovr
      - name: Core, JSON and firmware tests (ASan + UBSan)
        run: make -C test/host all
      - name: Line coverage of src/ (fails under 90 %)
        run: make -C test/host coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: test/host/build/coverage.txt

  firmware:
    name: ESP32 firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio/libdeps
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Build
        run: pio run -e ESP32_DMD
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: .pio/build/ESP32_DMD/firmware.bin
