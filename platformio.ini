[platformio]
default_envs = ESP32_DMD

[env:ESP32_DMD]
platform = espressif32
board = esp32dev
upload_speed = 460800
monitor_speed = 115200
framework = arduino
board_build.filesystem = littlefs
; 3 MB app / ~900 KB LittleFS data partition, no OTA: the default 1.25 MB app slot is too small for
; WiFiManager + web server + HUB75 + fonts. Changing the table wipes the filesystem (config.json) once.
board_build.partitions = huge_app.csv
lib_ldf_mode = deep+
; The Arduino core adds -std=gnu++11; drop it so -std=gnu++17 below applies.
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3  ; ESP_LOGx up to INFO (4 adds DEBUG)

; Host-side unit tests live in test/host (run: make -C test/host), not under the PlatformIO runner
test_ignore = host

lib_deps =
    knolleary/PubSubClient @ ^2.8
    tzapu/WiFiManager @ ^2.0.17
    bblanchon/ArduinoJson @ ^7.4.1
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display @ ^3.0.12
    adafruit/Adafruit GFX Library @ ^1.12.1
    bitbank2/AnimatedGIF @ ^2.1.1
    bitbank2/PNGdec @ ^1.1.0
monitor_filters = 
    esp32_exception_decoder
    log2file
    time
    colorize
